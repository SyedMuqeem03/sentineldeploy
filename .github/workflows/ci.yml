
name: SentinelDeploy CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/syedmuqeem03/sentineldeploy

jobs:

  # ==========================================
  # STAGE 1: PARALLEL QUALITY AND SECURITY CHECKS
  # ==========================================

  unit-tests:
    name: "Unit Tests - Node.js 22"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test


  secret-scan:
    name: "Security - Gitleaks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  filesystem-security:
    name: "Matrix - Trivy ${{ matrix.scan-type }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scan-type:
          - fs
          - config

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: ${{ matrix.scan-type }}
          scan-ref: .
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH


  # ==========================================
  # STAGE 2: DOCKER CONTAINER VALIDATION
  # ==========================================

  container-smoke-test:
    name: "Docker - Build and Smoke Test"
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - secret-scan
      - filesystem-security

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f app/Dockerfile \
            -t sentineldeploy:${{ github.sha }} .

      - name: Start application container
        run: |
          docker run -d \
            --rm \
            -p 3000:3000 \
            --name sentineldeploy-ci \
            sentineldeploy:${{ github.sha }}

      - name: Wait for application health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/healthz; then
              exit 0
            fi
            sleep 2
          done

          echo "Application health check failed"
          docker logs sentineldeploy-ci
          exit 1

      - name: Verify Prometheus metrics
        run: |
          curl -fsS http://localhost:3000/metrics \
            | grep "sentineldeploy_http_requests_total"

      - name: Stop application container
        if: always()
        run: docker stop sentineldeploy-ci || true


  # ==========================================
  # STAGE 3: CONTAINER IMAGE SECURITY
  # ==========================================

  image-security-scan:
    name: "Security - Trivy Container Image"
    runs-on: ubuntu-latest

    needs:
      - unit-tests
      - secret-scan
      - filesystem-security

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build image for security scanning
        run: |
          docker build \
            -f app/Dockerfile \
            -t sentineldeploy:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sentineldeploy:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH


  # ==========================================
  # STAGE 4: PUBLISH RELEASE IMAGE
  # ==========================================

  publish-image:
    name: "Release - Publish to GHCR"
    runs-on: ubuntu-latest

    needs:
      - container-smoke-test
      - image-security-scan

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            -f app/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push immutable image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Display published image
        run: |
          echo "Published image:"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"
